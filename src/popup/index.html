<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThumbsUp</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="brand-mark">👍</span>
        <div>
          <h1>ThumbsUp</h1>
          <p class="tagline" id="tagline">Gesture reactions for any video call</p>
        </div>
      </div>
      <label class="switch" title="Enable ThumbsUp">
        <input type="checkbox" id="master" />
        <span class="track"><span class="thumb"></span></span>
      </label>
    </header>

    <section class="status" id="status" data-state="idle">
      <span class="status-dot"></span>
      <span class="status-text" id="status-text">Checking this tab…</span>
    </section>

    <section class="section">
      <h2>Reactions</h2>
      <ul class="reactions" id="reactions"></ul>
    </section>

    <section class="section">
      <h2>Tuning</h2>
      <div class="field">
        <label for="hold">Hold time <output id="hold-value"></output></label>
        <input type="range" id="hold" min="300" max="2000" step="50" />
        <p class="hint">How long to hold a gesture before it fires.</p>
      </div>
      <div class="field">
        <label for="cooldown">Cooldown <output id="cooldown-value"></output></label>
        <input type="range" id="cooldown" min="500" max="8000" step="250" />
        <p class="hint">Minimum gap between two reactions.</p>
      </div>
      <div class="field">
        <label for="sensitivity">Sensitivity <output id="sensitivity-value"></output></label>
        <input type="range" id="sensitivity" min="10" max="95" step="5" />
        <p class="hint">Lower is more eager, higher rejects uncertain hands.</p>
      </div>
      <label class="checkbox">
        <input type="checkbox" id="hud" />
        <span>Show on-screen indicator</span>
      </label>
    </section>

    <footer class="footer">
      <button type="button" id="block-site" class="ghost">Disable on this site</button>
      <span class="version" id="version"></span>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
